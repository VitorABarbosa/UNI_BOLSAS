packages:
  - .

allowBuilds:
  # core-js (opcional do jspdf): o script de instalação só imprime um pedido
  # de doação. Sem esta linha o pnpm 11 recusa a instalação.
  core-js: false
  esbuild: true
  msw: true
  sharp: true
  supabase: true
  unrs-resolver: true

onlyBuiltDependencies:
  - esbuild
  - msw
  - sharp
  - supabase
  - unrs-resolver

# Layout achatado do node_modules (sem symlinks): o runtime da Hostinger
# (lsnode) copia node_modules/next desreferenciando o link e perde as deps
# internas do Next (@swc/helpers) que o pnpm isolado guarda so em .pnpm/.
nodeLinker: hoisted
