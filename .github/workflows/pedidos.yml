# Checagem automática dos pedidos do site, de hora em hora:
# rastreio, e-mails de "postado"/"entregue" e nova tentativa de nota/etiqueta.
#
# Opcional. Só roda se existir o segredo CRON_SECRET no GitHub (Settings →
# Secrets and variables → Actions), com o MESMO valor da variável da Hostinger.
# Sem ele, termina em silêncio (sem erro e sem e-mail de falha).
name: Checagem dos pedidos

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Chamar a checagem no site
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Sem o segredo CRON_SECRET no GitHub: checagem desligada."; exit 0; fi
          curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" https://unibolsas.store/api/automacao/rastreio
